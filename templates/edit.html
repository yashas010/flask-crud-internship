<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin-top: 50px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: linear-gradient(to right, #ffffff, #f9f9f9);
        }
        .card-header {
            background: linear-gradient(to right, #4e73df, #3558b7);
            color: white;
            border-radius: 15px 15px 0 0 !important;
        }
        .btn-primary {
            background: linear-gradient(to right, #4e73df, #3558b7);
            border: none;
            box-shadow: 0 4px 12px rgba(78, 115, 223, 0.2);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(78, 115, 223, 0.3);
            background: linear-gradient(to right, #3558b7, #2a4494);
        }
        .user-photo {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 3px solid white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-header py-3">
                    <h4 class="m-0 font-weight-bold"><i class="fas fa-user-edit me-2"></i> Edit User</h4>
                </div>
                <div class="card-body p-4">
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}
                    
                    <form method="POST" enctype="multipart/form-data" id="editUserForm" novalidate>
                        <div class="row mb-4">
                            <div class="col-md-3 text-center mb-3 mb-md-0">
                                {% if user.photo %}
                                    <img src="{{ url_for('static', filename='uploads/' ~ user.photo) }}" class="user-photo">
                                {% else %}
                                    <div class="user-photo bg-secondary d-flex align-items-center justify-content-center">
                                        <span class="text-white fs-1">{{ user.name[0] | upper }}</span>
                                    </div>
                                {% endif %}
                            </div>
                            <div class="col-md-9">
                                <div class="mb-3">
                                    <label class="form-label" for="edit-name">Full Name</label>
                                    <input type="text" id="edit-name" name="name" class="form-control" value="{{ user.name }}" required>
                                    <div class="error-message" id="edit-name-error"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="edit-dob">Date of Birth</label>
                                    <input type="date" id="edit-dob" name="dob" class="form-control" value="{{ user.dob }}" required>
                                    <div class="error-message" id="edit-dob-error"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="edit-email">Email</label>
                                <input type="email" id="edit-email" name="email" class="form-control" value="{{ user.email }}" required>
                                <div class="error-message" id="edit-email-error"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile No</label>
                                <div class="phone-input-group d-flex">
                                    <select id="edit-country-code" name="country-code" class="form-select" style="max-width: 120px;">
                                        <option value="+91" {{ '+91' in user.mobile and 'selected' or '' }}>🇮🇳 +91</option>
                                        <option value="+1" {{ '+1' in user.mobile and 'selected' or '' }}>🇺🇸 +1</option>
                                        <option value="+44" {{ '+44' in user.mobile and 'selected' or '' }}>🇬🇧 +44</option>
                                        <option value="+33" {{ '+33' in user.mobile and 'selected' or '' }}>🇫🇷 +33</option>
                                        <option value="+49" {{ '+49' in user.mobile and 'selected' or '' }}>🇩🇪 +49</option>
                                        <option value="+81" {{ '+81' in user.mobile and 'selected' or '' }}>🇯🇵 +81</option>
                                        <option value="+86" {{ '+86' in user.mobile and 'selected' or '' }}>🇨🇳 +86</option>
                                        <option value="+61" {{ '+61' in user.mobile and 'selected' or '' }}>🇦🇺 +61</option>
                                        <option value="+55" {{ '+55' in user.mobile and 'selected' or '' }}>🇧🇷 +55</option>
                                        <option value="+7" {{ '+7' in user.mobile and 'selected' or '' }}>🇷🇺 +7</option>
                                    </select>
                                    <input type="tel" id="edit-mobile-number" name="mobile-number" class="form-control ms-2" placeholder="Enter mobile number" value="{% if user.mobile.startswith('+91') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+1') %}{{ user.mobile[2:] }}{% elif user.mobile.startswith('+44') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+33') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+49') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+81') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+86') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+61') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+55') %}{{ user.mobile[3:] }}{% elif user.mobile.startswith('+7') %}{{ user.mobile[2:] }}{% else %}{{ user.mobile }}{% endif %}" required>
                                </div>
                                <div class="error-message" id="edit-mobile-error"></div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label" for="edit-photo">Update Photo</label>
                            <input type="file" id="edit-photo" name="photo" class="form-control" accept="image/*">
                            <div class="mt-2">
                                <img id="edit-photo-preview" src="" alt="Photo Preview" style="display: none; width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #ddd;">
                            </div>
                            <div class="error-message" id="edit-photo-error"></div>
                        </div>
                        
                        <div class="mt-4 text-center">
                            <button type="submit" id="edit-submit-btn" class="btn btn-primary px-4 py-2">Save Changes</button>
                            <a href="{{ url_for('users') }}" class="btn btn-outline-secondary px-4 py-2 ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .error-message {
        color: #dc3545;
        font-size: 0.8rem;
        margin-top: 0.25rem;
        min-height: 1rem;
    }
    
    .is-valid {
        border-color: #28a745 !important;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25) !important;
    }
    
    .is-invalid {
        border-color: #dc3545 !important;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
    }
    
    .phone-input-group {
        gap: 0.5rem;
    }
    
    .btn-loading {
        position: relative;
        pointer-events: none;
    }
    
    .btn-loading::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        margin: auto;
        border: 2px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: button-loading-spinner 1s ease infinite;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }
    
    @keyframes button-loading-spinner {
        from {
            transform: rotate(0turn);
        }
        to {
            transform: rotate(1turn);
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('editUserForm');
    const submitBtn = document.getElementById('edit-submit-btn');
    const emailInput = document.getElementById('edit-email');
    const photoInput = document.getElementById('edit-photo');
    const photoPreview = document.getElementById('edit-photo-preview');
    
    // Auto-dismiss success alerts after 4 seconds
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert-success');
        alerts.forEach(alert => {
            alert.style.transition = 'opacity 0.5s';
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500);
        });
    }, 4000);
    
    // Unified validation function
    function validateForm() {
        const errors = {};
        const name = document.getElementById('edit-name').value.trim();
        const email = document.getElementById('edit-email').value.trim();
        const dob = document.getElementById('edit-dob').value;
        const countryCode = document.getElementById('edit-country-code').value;
        const mobileNumber = document.getElementById('edit-mobile-number').value.trim();
        
        // Clear previous errors
        clearErrors();
        
        // Name validation
        if (!name) {
            errors.name = 'Full name is a required field.';
        }
        
        // Email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
            errors.email = 'Please enter a valid email address (e.g., user@example.com).';
        }
        
        // DOB validation
        if (!dob) {
            errors.dob = 'Date of birth is required.';
        }
        
        // Mobile validation based on country code
        let isValidMobile = false;
        if (!mobileNumber) {
            errors.mobile = 'Mobile number is required.';
        } else {
            switch(countryCode) {
                case '+91': // India
                    isValidMobile = /^\d{10}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid 10-digit Indian mobile number.';
                    break;
                case '+1': // US/Canada
                    isValidMobile = /^\d{10}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid 10-digit US/Canada number.';
                    break;
                case '+44': // UK
                    isValidMobile = /^\d{10,11}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid UK mobile number (10-11 digits).';
                    break;
                default:
                    isValidMobile = /^\d{7,15}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid mobile number (7-15 digits).';
            }
        }
        
        return errors;
    }
    
    // Clear all error messages
    function clearErrors() {
        const errorElements = document.querySelectorAll('.error-message');
        errorElements.forEach(el => el.textContent = '');
        
        const inputs = document.querySelectorAll('.form-control, .form-select');
        inputs.forEach(input => {
            input.classList.remove('is-valid', 'is-invalid');
        });
    }
    
    // Display errors inline
    function displayErrors(errors) {
        Object.keys(errors).forEach(field => {
            const errorElement = document.getElementById('edit-' + field + '-error');
            const inputElement = document.getElementById('edit-' + (field === 'mobile' ? 'mobile-number' : field));
            
            if (errorElement) {
                errorElement.textContent = errors[field];
            }
            if (inputElement) {
                inputElement.classList.add('is-invalid');
            }
        });
    }
    
    // Real-time email validation
    emailInput.addEventListener('input', function() {
        const emailValue = this.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const errorElement = document.getElementById('edit-email-error');
        
        if (!emailValue) {
            this.classList.remove('is-valid', 'is-invalid');
            errorElement.textContent = '';
        } else if (emailRegex.test(emailValue)) {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
            errorElement.textContent = '';
        } else {
            this.classList.remove('is-valid');
            this.classList.add('is-invalid');
            errorElement.textContent = 'Please enter a valid email address.';
        }
    });
    
    // Photo preview functionality
    photoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoPreview.src = e.target.result;
                photoPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            photoPreview.style.display = 'none';
        }
    });
    
    // Form submission with validation
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const errors = validateForm();
        
        if (Object.keys(errors).length > 0) {
            displayErrors(errors);
            return false;
        }
        
        // Show loading state
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = 'Saving...';
        
        // Combine country code and mobile number for backend
        const countryCode = document.getElementById('edit-country-code').value;
        const mobileNumber = document.getElementById('edit-mobile-number').value;
        const hiddenMobileInput = document.createElement('input');
        hiddenMobileInput.type = 'hidden';
        hiddenMobileInput.name = 'mobile';
        hiddenMobileInput.value = countryCode + mobileNumber;
        form.appendChild(hiddenMobileInput);
        
        // Submit the form
        form.submit();
    });
});
</script>
</body>
</html>
