<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship CRUD App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin-top: 60px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: linear-gradient(to right, #ffffff, #f9f9f9);
        }
        .btn-primary {
            background: linear-gradient(to right, #4e73df, #3558b7);
            border: none;
            box-shadow: 0 4px 12px rgba(78, 115, 223, 0.2);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(78, 115, 223, 0.3);
            background: linear-gradient(to right, #3558b7, #2a4494);
        }
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .header-section h1 {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .header-section p {
            color: #7f8c8d;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h1>User Management System</h1>
        <p class="lead">Welcome to your onboarding task. Create and manage users with ease.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Add New User</h3>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        {% for category, message in messages %}
                          <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                          </div>
                        {% endfor %}
                      {% endif %}
                    {% endwith %}
                    
                    <form method="POST" action="{{ url_for('index') }}" enctype="multipart/form-data" id="addUserForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                            <div class="error-message" id="name-error"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="dob">Date of Birth</label>
                            <input type="date" id="dob" name="dob" class="form-control" required>
                            <div class="error-message" id="dob-error"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                            <div class="error-message" id="email-error"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mobile No</label>
                            <div class="phone-input-group d-flex">
                                <select id="country-code" name="country-code" class="form-select" style="max-width: 120px;">
                                    <option value="+91">🇮🇳 +91</option>
                                    <option value="+1">🇺🇸 +1</option>
                                    <option value="+44">🇬🇧 +44</option>
                                    <option value="+33">🇫🇷 +33</option>
                                    <option value="+49">🇩🇪 +49</option>
                                    <option value="+81">🇯🇵 +81</option>
                                    <option value="+86">🇨🇳 +86</option>
                                    <option value="+61">🇦🇺 +61</option>
                                    <option value="+55">🇧🇷 +55</option>
                                    <option value="+7">🇷🇺 +7</option>
                                </select>
                                <input type="tel" id="mobile-number" name="mobile-number" class="form-control ms-2" placeholder="Enter mobile number" required>
                            </div>
                            <div class="error-message" id="mobile-error"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="photo">Photo</label>
                            <input type="file" id="photo" name="photo" class="form-control" accept="image/*">
                            <div class="mt-2">
                                <img id="photo-preview" src="" alt="Photo Preview" style="display: none; width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #ddd;">
                            </div>
                            <div class="error-message" id="photo-error"></div>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" id="submit-btn" class="btn btn-primary btn-lg px-5">Add User</button>
                            <a href="{{ url_for('users') }}" class="btn btn-outline-primary btn-lg ms-2">View All Users</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .error-message {
        color: #dc3545;
        font-size: 0.8rem;
        margin-top: 0.25rem;
        min-height: 1rem;
    }
    
    .is-valid {
        border-color: #28a745 !important;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25) !important;
    }
    
    .is-invalid {
        border-color: #dc3545 !important;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
    }
    
    .phone-input-group {
        gap: 0.5rem;
    }
    
    .btn-loading {
        position: relative;
        pointer-events: none;
    }
    
    .btn-loading::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        margin: auto;
        border: 2px solid transparent;
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: button-loading-spinner 1s ease infinite;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }
    
    @keyframes button-loading-spinner {
        from {
            transform: rotate(0turn);
        }
        to {
            transform: rotate(1turn);
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('addUserForm');
    const submitBtn = document.getElementById('submit-btn');
    const emailInput = document.getElementById('email');
    const photoInput = document.getElementById('photo');
    const photoPreview = document.getElementById('photo-preview');
    
    // Auto-dismiss success alerts after 4 seconds
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert-success');
        alerts.forEach(alert => {
            alert.style.transition = 'opacity 0.5s';
            alert.style.opacity = '0';
            setTimeout(() => alert.remove(), 500);
        });
    }, 4000);
    
    // Unified validation function
    function validateForm() {
        const errors = {};
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const dob = document.getElementById('dob').value;
        const countryCode = document.getElementById('country-code').value;
        const mobileNumber = document.getElementById('mobile-number').value.trim();
        
        // Clear previous errors
        clearErrors();
        
        // Name validation
        if (!name) {
            errors.name = 'Full name is a required field.';
        }
        
        // Email validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !emailRegex.test(email)) {
            errors.email = 'Please enter a valid email address (e.g., user@example.com).';
        }
        
        // DOB validation
        if (!dob) {
            errors.dob = 'Date of birth is required.';
        }
        
        // Mobile validation based on country code
        let isValidMobile = false;
        if (!mobileNumber) {
            errors.mobile = 'Mobile number is required.';
        } else {
            switch(countryCode) {
                case '+91': // India
                    isValidMobile = /^\d{10}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid 10-digit Indian mobile number.';
                    break;
                case '+1': // US/Canada
                    isValidMobile = /^\d{10}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid 10-digit US/Canada number.';
                    break;
                case '+44': // UK
                    isValidMobile = /^\d{10,11}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid UK mobile number (10-11 digits).';
                    break;
                default:
                    isValidMobile = /^\d{7,15}$/.test(mobileNumber);
                    if (!isValidMobile) errors.mobile = 'Please enter a valid mobile number (7-15 digits).';
            }
        }
        
        return errors;
    }
    
    // Clear all error messages
    function clearErrors() {
        const errorElements = document.querySelectorAll('.error-message');
        errorElements.forEach(el => el.textContent = '');
        
        const inputs = document.querySelectorAll('.form-control, .form-select');
        inputs.forEach(input => {
            input.classList.remove('is-valid', 'is-invalid');
        });
    }
    
    // Display errors inline
    function displayErrors(errors) {
        Object.keys(errors).forEach(field => {
            const errorElement = document.getElementById(field + '-error');
            const inputElement = document.getElementById(field === 'mobile' ? 'mobile-number' : field);
            
            if (errorElement) {
                errorElement.textContent = errors[field];
            }
            if (inputElement) {
                inputElement.classList.add('is-invalid');
            }
        });
    }
    
    // Real-time email validation
    emailInput.addEventListener('input', function() {
        const emailValue = this.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const errorElement = document.getElementById('email-error');
        
        if (!emailValue) {
            this.classList.remove('is-valid', 'is-invalid');
            errorElement.textContent = '';
        } else if (emailRegex.test(emailValue)) {
            this.classList.remove('is-invalid');
            this.classList.add('is-valid');
            errorElement.textContent = '';
        } else {
            this.classList.remove('is-valid');
            this.classList.add('is-invalid');
            errorElement.textContent = 'Please enter a valid email address.';
        }
    });
    
    // Photo preview functionality
    photoInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoPreview.src = e.target.result;
                photoPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            photoPreview.style.display = 'none';
        }
    });
    
    // Form submission with validation
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const errors = validateForm();
        
        if (Object.keys(errors).length > 0) {
            displayErrors(errors);
            return false;
        }
        
        // Show loading state
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');
        submitBtn.textContent = 'Adding...';
        
        // Combine country code and mobile number for backend
        const countryCode = document.getElementById('country-code').value;
        const mobileNumber = document.getElementById('mobile-number').value;
        const hiddenMobileInput = document.createElement('input');
        hiddenMobileInput.type = 'hidden';
        hiddenMobileInput.name = 'mobile';
        hiddenMobileInput.value = countryCode + mobileNumber;
        form.appendChild(hiddenMobileInput);
        
        // Submit the form
        form.submit();
    });
});
</script>
</body>
</html>
